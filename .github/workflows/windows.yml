name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt -r requirements-dev.txt
      - name: Install WebView2 for the desktop test
        run: choco install webview2-runtime --yes --no-progress
      - name: Fetch the pinned Windows AI runtime
        run: python scripts/fetch_runtime_windows.py
      - name: Run regression tests on Windows
        run: python -m pytest tests/ -q
      - name: Build and exercise the packaged desktop app
        run: ./scripts/build_windows.ps1 -SkipInstall -TestAI
      - name: Upload the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Windows-x64
          path: |
            dist/Balance-Windows-x64.zip
            dist/Balance-Windows-x64.zip.sha256
            dist/Balance-Windows-x64-Setup.exe
            dist/Balance-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
      - name: Upload desktop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-evidence
          path: build/windows-smoke/
          if-no-files-found: ignore
