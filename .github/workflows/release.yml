# Build Balance.app and publish it as a GitHub release.
#
# Push a version tag and this does the rest:
#
#     scripts/release.sh 1.3.1
#
# The tag is the trigger. update.sh and Sparkle both read whatever is attached
# to the newest release, so nothing reaches anyone's Mac until this has run.
#
# Three jobs:
#   preflight  the cheap checks, and the one that needs the signing key
#   build      .github/workflows/build.yml, the same build every pull request
#              runs, with the llama.cpp runtime compiled fresh
#   publish    sign the appcast, then publish draft-first
#
# Safe to re-run on the same tag. The release is created as a draft, its
# assets are checked, and only then is it published as latest — so a run that
# fails part way leaves at most a draft, which the next run replaces. A tag
# whose release is already published is refused rather than overwritten.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Two runs on one tag would race to create the same release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check the tag matches VERSION
        # Tagging v1.3.1 while VERSION still says 1.3.0 ships an app that
        # misreports itself.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag but VERSION says $file."
            echo "Bump VERSION in a pull request, then tag — scripts/release.sh checks both."
            exit 1
          fi
          python3 scripts/changelog.py "$file" > /dev/null \
            || { echo "CHANGELOG.md has no '## $file' section."; exit 1; }
          echo "Releasing $file"

      - name: Check this tag is not already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            false) echo "$GITHUB_REF_NAME is already published. Release a new version instead."; exit 1 ;;
            true)  echo "A draft for $GITHUB_REF_NAME exists from an earlier run; publish will replace it." ;;
            *)     echo "No release for $GITHUB_REF_NAME yet." ;;
          esac

      - name: Check the Sparkle signing key
        # Before the 15-minute build, not after it.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_PRIVATE_KEY is required to publish a signed update." >&2
            exit 1
          fi
          python3 -m pip install -q -c constraints.txt cryptography
          python3 scripts/publish_appcast.py --validate-key-only

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      # A release never depends on a cache. Compiling costs about four minutes
      # on the runner; a stale binary would be a baffling way to lose one.
      fresh-runtime: true

  publish:
    needs: build
    # macOS: Sparkle's sign_update is a Mac binary.
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write   # create the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: with no changelog section the notes fall
          # back to the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the appcast dependencies
        run: python3 -m pip install -q -c constraints.txt cryptography

      - name: Fetch Sparkle
        run: ./scripts/fetch_sparkle.sh

      - name: Take the zip the build made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Balance-macOS-arm64
          path: dist

      - name: Create and sign the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/publish_appcast.py \
            --archive dist/Balance-macOS-arm64.zip \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --output dist/appcast.xml
          grep -q "<sparkle:version>$version</sparkle:version>" dist/appcast.xml \
            || { echo "The appcast does not list $version."; exit 1; }

      - name: Write the release notes
        run: |
          body_file=$(mktemp)
          version="${GITHUB_REF_NAME#v}"
          # Readers see the changelog section. A tag with no section still
          # ships: the notes are the commit subjects, as earlier releases were.
          if python3 scripts/changelog.py "$version" > "$body_file"; then
            echo "Release notes taken from CHANGELOG.md"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "CHANGELOG.md has no section for $version — using commit subjects"
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..${GITHUB_REF_NAME}" > "$body_file"
            else
              git log --no-merges --pretty='- %s' -20 > "$body_file"
            fi
          fi
          {
            printf 'Apple Silicon build (M1–M4).\n\n'
            cat "$body_file"
            printf '\n**Update**\n\nQuit Balance, then run:\n\n'
            printf '    curl -fsSL https://raw.githubusercontent.com/%s/main/update.sh | bash\n\n' "$GITHUB_REPOSITORY"
            printf 'Your data in ~/Library/Application Support/Balance/ is not touched.\n'
          } > dist/notes.md

      - name: Publish the release
        run: |
          tag="$GITHUB_REF_NAME"
          # Checked again here: the build took a quarter of an hour.
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            false) echo "$tag was published while this ran. Leaving it alone."; exit 1 ;;
            true)  echo "Replacing the draft an earlier run left"
                   gh release delete "$tag" --yes ;;   # no --cleanup-tag: the tag stays
          esac

          # A draft is invisible to update.sh and to Sparkle: releases/latest
          # skips drafts. Nothing anyone downloads changes until the edit below.
          gh release create "$tag" \
            dist/Balance-macOS-arm64.zip \
            dist/appcast.xml \
            --draft \
            --verify-tag \
            --title "Balance ${tag#v}" \
            --notes-file dist/notes.md

          # Every asset there, at the size it left this machine.
          for f in Balance-macOS-arm64.zip appcast.xml; do
            want=$(stat -f %z "dist/$f")
            got=$(gh release view "$tag" --json assets \
                  --jq ".assets[] | select(.name == \"$f\") | .size")
            [ "$got" = "$want" ] || { echo "$f is '$got' bytes on the release, $want here."; exit 1; }
          done

          gh release edit "$tag" --draft=false --latest
          echo "Published $tag"

      - name: Check what update.sh will download
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [ "$latest" = "$GITHUB_REF_NAME" ] \
            || { echo "Latest release is $latest, not $GITHUB_REF_NAME."; exit 1; }
          echo "Latest release is $latest"
